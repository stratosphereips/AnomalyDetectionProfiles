[common]
training_windows = 6
window_seconds = 3600
normal_dirs =
sensitivity = 0.5
ignore_multicast_broadcast = true

[output]
color = never
show_terminal_data = false
quiet = true

[multi_protocol]
output_dir = multi_protocol_ad_output
minimum_points = 8
threshold = 3.6
threshold_quantile = 0.995
drift_alpha = 0.05
suspicious_alpha = 0.005
adaptation_score = 8
protocol_score_cap = 10
global_threshold = 0.65
minimum_protocols = 2
corroboration_bonus = 0.15
corroboration_bonus_cap = 0.3
uid_corroboration_bonus = 0.1
uid_corroboration_bonus_cap = 0.2
max_responsible_flows = 10
ssl_hourly_threshold = 3.5
ssl_flow_threshold = 3.5
ssl_novelty_threshold = 1.5
ssl_baseline_alpha = 0.1
ssl_max_small_anomalies = 2
experimental_noop_mode = off
experimental_mirror_mode = shadow
experimental_multivariate_mode = shadow
multivariate_minimum_points = 8
multivariate_threshold = 3.0
multivariate_shrinkage = 0.5
multivariate_history_limit = 64
experimental_pca_mode = shadow
pca_minimum_points = 8
pca_threshold = 2.5
pca_components = 2
pca_history_limit = 64
experimental_isolation_mode = shadow
isolation_minimum_points = 8
isolation_threshold = 0.65
isolation_trees = 32
isolation_history_limit = 64
experimental_rarity_mode = shadow
rarity_minimum_points = 8
rarity_threshold = 1.0
rarity_history_limit = 64
experimental_change_mode = shadow
change_minimum_points = 8
change_threshold = 3.0
change_recent_windows = 3
change_history_limit = 64
experimental_graph_mode = shadow
graph_minimum_points = 6
graph_threshold = 0.65
graph_history_limit = 64
